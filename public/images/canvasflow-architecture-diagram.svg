<svg width="900" height="640" viewBox="0 0 900 640" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#64748b"/>
    </marker>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="900" height="640" fill="#ffffff"/>

  <text x="450" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#0f172a">CanvasFlow — System Architecture</text>
  <text x="450" y="66" text-anchor="middle" font-size="13" fill="#64748b">Real-time collaborative design canvas</text>

  <!-- Browser / Client container -->
  <rect x="60" y="95" width="780" height="130" rx="14" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="82" y="120" font-size="13" font-weight="700" fill="#1d4ed8">BROWSER — Next.js 15.5 · React 19.1</text>

  <g filter="url(#softShadow)">
    <rect x="90" y="140" width="210" height="66" rx="10" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  </g>
  <text x="195" y="168" text-anchor="middle" font-size="14" font-weight="600" fill="#1e3a8a">Liveblocks Client</text>
  <text x="195" y="187" text-anchor="middle" font-size="11" fill="#475569">Canvas presence + storage</text>

  <g filter="url(#softShadow)">
    <rect x="345" y="140" width="210" height="66" rx="10" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  </g>
  <text x="450" y="168" text-anchor="middle" font-size="14" font-weight="600" fill="#1e3a8a">Socket.IO Client</text>
  <text x="450" y="187" text-anchor="middle" font-size="11" fill="#475569">Notifications, invites, events</text>

  <g filter="url(#softShadow)">
    <rect x="600" y="140" width="210" height="66" rx="10" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  </g>
  <text x="705" y="168" text-anchor="middle" font-size="14" font-weight="600" fill="#1e3a8a">Axios HTTP Client</text>
  <text x="705" y="187" text-anchor="middle" font-size="11" fill="#475569">REST calls via useApi()</text>

  <!-- Liveblocks Cloud -->
  <g filter="url(#softShadow)">
    <rect x="90" y="290" width="230" height="72" rx="10" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.5"/>
  </g>
  <text x="205" y="320" text-anchor="middle" font-size="14" font-weight="700" fill="#6b21a8">Liveblocks Cloud</text>
  <text x="205" y="340" text-anchor="middle" font-size="11" fill="#6b7280">CRDT-based canvas sync</text>
  <text x="205" y="354" text-anchor="middle" font-size="11" fill="#6b7280">Storage + Presence</text>

  <!-- NestJS Backend container -->
  <rect x="345" y="280" width="465" height="290" rx="14" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/>
  <text x="367" y="305" font-size="13" font-weight="700" fill="#0f766e">NESTJS 11 API (EXPRESS) — HOSTED ON RENDER</text>

  <g filter="url(#softShadow)">
    <rect x="370" y="320" width="210" height="60" rx="10" fill="#ffffff" stroke="#5eead4" stroke-width="1.5"/>
  </g>
  <text x="475" y="345" text-anchor="middle" font-size="14" font-weight="600" fill="#134e4a">Controllers / Services</text>
  <text x="475" y="363" text-anchor="middle" font-size="11" fill="#475569">11 domain modules</text>

  <g filter="url(#softShadow)">
    <rect x="600" y="320" width="185" height="60" rx="10" fill="#ffffff" stroke="#5eead4" stroke-width="1.5"/>
  </g>
  <text x="692" y="345" text-anchor="middle" font-size="14" font-weight="600" fill="#134e4a">Clerk Backend</text>
  <text x="692" y="363" text-anchor="middle" font-size="11" fill="#475569">JWT verification</text>

  <g filter="url(#softShadow)">
    <rect x="370" y="410" width="210" height="56" rx="10" fill="#ffffff" stroke="#5eead4" stroke-width="1.5"/>
  </g>
  <text x="475" y="443" text-anchor="middle" font-size="14" font-weight="600" fill="#134e4a">Prisma ORM</text>

  <g filter="url(#softShadow)">
    <rect x="370" y="495" width="210" height="56" rx="10" fill="#0f172a" stroke="#0f172a"/>
  </g>
  <text x="475" y="528" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">PostgreSQL</text>

  <!-- Clerk Cloud -->
  <g filter="url(#softShadow)">
    <rect x="600" y="410" width="185" height="141" rx="10" fill="#fff1f2" stroke="#fda4af" stroke-width="1.5"/>
  </g>
  <text x="692" y="440" text-anchor="middle" font-size="14" font-weight="700" fill="#9f1239">Clerk Cloud</text>
  <text x="692" y="460" text-anchor="middle" font-size="11" fill="#6b7280">Auth UI</text>
  <text x="692" y="476" text-anchor="middle" font-size="11" fill="#6b7280">JWT issuance</text>
  <text x="692" y="492" text-anchor="middle" font-size="11" fill="#6b7280">Session management</text>

  <!-- Arrows -->
  <!-- Liveblocks client -> Liveblocks Cloud -->
  <path d="M195 206 L205 288" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="150" y="255" font-size="10.5" fill="#475569">WebSocket sync</text>

  <!-- Liveblocks Cloud -> API (webhook) -->
  <path d="M320 330 L370 335" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="322" y="322" font-size="10.5" fill="#475569">webhook</text>

  <!-- Socket client -> API -->
  <path d="M450 206 L475 318" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="452" y="255" font-size="10.5" fill="#475569">WebSocket events</text>

  <!-- Axios -> API -->
  <path d="M705 206 L600 335" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="600" y="255" font-size="10.5" fill="#475569">REST + JWT</text>

  <!-- API -> Prisma -->
  <path d="M475 380 L475 408" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- Prisma -> Postgres -->
  <path d="M475 466 L475 493" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- API -> Clerk backend -->
  <path d="M600 350 L598 350" fill="none" stroke="#64748b" stroke-width="1.5"/>

  <!-- Axios / Liveblocks -> Clerk cloud (auth, dashed) -->
  <path d="M810 173 C 850 173, 850 460, 787 470" fill="none" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
  <text x="815" y="300" font-size="10.5" fill="#64748b" transform="rotate(90 815 300)">session / JWT</text>

  <path d="M90 175 C 30 175, 30 460, 598 470" fill="none" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
  <text x="20" y="330" font-size="10.5" fill="#64748b" transform="rotate(-90 20 330)">auth request</text>

  <!-- Legend -->
  <line x1="90" y1="600" x2="120" y2="600" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="128" y="604" font-size="11" fill="#475569">Data flow</text>
  <line x1="220" y1="600" x2="250" y2="600" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
  <text x="258" y="604" font-size="11" fill="#475569">Auth flow</text>

  <text x="810" y="604" text-anchor="end" font-size="10.5" fill="#94a3b8">CanvasFlow · Architecture Overview</text>
</svg>
